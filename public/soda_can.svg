<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="canRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24"/>

  <!-- Shadow under can -->
  <ellipse cx="200" cy="350" rx="75" ry="18" fill="rgba(0,0,0,0.6)" filter="blur(8px)"/>

  <!-- Can Top Rim -->
  <path d="M 130 90 Q 200 65 270 90 L 270 105 Q 200 120 130 105 Z" fill="url(#canRim)"/>
  <ellipse cx="200" cy="85" rx="70" ry="18" fill="url(#canRim)"/>
  <ellipse cx="200" cy="85" rx="55" ry="12" fill="#475569"/>
  <!-- Pull tab -->
  <ellipse cx="200" cy="85" rx="14" ry="7" fill="#cbd5e1"/>
  <circle cx="200" cy="85" r="4" fill="#1e293b"/>

  <!-- Can Main Body -->
  <path d="M 130 105 Q 200 120 270 105 L 270 320 Q 200 340 130 320 Z" fill="url(#canBody)"/>

  <!-- Metallic vertical highlights -->
  <rect x="165" y="105" width="25" height="220" fill="url(#shine)"/>

  <!-- Decorative Soda Branding -->
  <g transform="translate(200,210) rotate(-15)">
    <text x="0" y="-15" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">ALUMINUM</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="#facc15" text-anchor="middle" letter-spacing="1">SODA</text>
    <rect x="-60" y="38" width="120" height="4" fill="#ffffff" rx="2"/>
    <text x="0" y="58" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f8fafc" text-anchor="middle">100% RECYCLABLE</text>
  </g>

  <!-- Can Bottom Rim -->
  <path d="M 130 320 Q 200 340 270 320 L 270 330 Q 200 345 130 330 Z" fill="url(#canRim)"/>
</svg>
